name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  contract:
    name: Contract (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.23.1", "24.18.0"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run verify:source
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22.23.1'
        run: npm run verify:oracle
      - run: npm run typecheck
      - run: npm test
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22.23.1'
        run: npm run coverage:domain

  bun:
    name: Contract (${{ matrix.os }}, Bun 1.3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run test:bun

  package:
    name: Packed package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.23.1", "24.18.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: node scripts/package-smoke.mjs

  runtime-drift:
    name: Current runtime drift
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bun
