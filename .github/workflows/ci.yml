name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  contract:
    name: Contract (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run verify:source
      - run: npm run typecheck
      - run: npm test

  bun:
    name: Contract (${{ matrix.os }}, Bun 1.3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run test:bun

  package:
    name: Packed package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm pack
      - run: npm install --prefix "$RUNNER_TEMP/ontrack-smoke" ./bunizao-ontrack-*.tgz
      - run: node "$RUNNER_TEMP/ontrack-smoke/node_modules/@bunizao/ontrack/dist/cli.js" --help
      - run: bun "$RUNNER_TEMP/ontrack-smoke/node_modules/@bunizao/ontrack/dist/cli.js" --version

  runtime-drift:
    name: Current runtime drift
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bun
