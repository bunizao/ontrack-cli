name: Preview build

# Packages every pull request so a tester can install exactly that commit. The token here
# is read-only, so a fork's code never runs with write access; preview-comment.yml posts
# the install instructions afterwards without checking anything out.

on:
  pull_request:
    # Only changes that can alter what a tester installs; later patterns win.
    paths:
      - "**"
      - "!docs/**"
      - "!release-notes/**"
      - "!spikes/**"
      - "!.github/**"
      - ".github/workflows/preview.yml"
      - "!README.md"
      - "!CONTRIBUTING.md"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The next patch with a prerelease tag, so `ontrack --version` names the pull
      # request and commit. src/version.ts reads package.json, so that is all it takes.
      - name: Stamp preview version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const [major, minor, patch] = pkg.version.split("-")[0].split(".").map(Number);
          const label = process.env.PR_NUMBER ? `pr.${process.env.PR_NUMBER}` : "dev";
          const version = `${major}.${minor}.${patch + 1}-${label}.g${process.env.HEAD_SHA.slice(0, 7)}`;
          pkg.version = version;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`version=${version}`);
          JS

      # prepack builds the CLI and the remote MCP Worker bundle.
      - name: Pack npm package
        run: |
          mkdir -p preview
          npm pack --pack-destination preview

      - name: Smoke test packed CLI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tmp="$(mktemp -d)"
          npm install --prefix "$tmp" "./preview/ontrack-${VERSION}.tgz" >/dev/null
          test "$("$tmp/node_modules/.bin/ontrack" --version)" = "$VERSION"

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: ontrack-${{ steps.version.outputs.version }}-npm
          path: preview/ontrack-${{ steps.version.outputs.version }}.tgz
          retention-days: 14
          if-no-files-found: error

      - name: Summarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Preview \`${VERSION}\`

          \`\`\`sh
          gh run download ${RUN_ID} -R ${REPO} -n ontrack-${VERSION}-npm
          npm install -g ./ontrack-${VERSION}.tgz
          \`\`\`

          Back to the release: \`npm install -g ontrack@latest\`
          EOF
